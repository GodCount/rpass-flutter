name: Build Android APK

# 没有安装 rust, 因为镜像自带了
# 并会在 flutter 构建时执行 packages/keepass_core/hook/build.dart
# native_toolchain_rust 会查找入口点下的 rust-toolchain.toml


on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.38.10"

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Decode key.properties file
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: echo $ENCODED_STRING | base64 -di > apps/rpass/android/key.properties

      - name: Decode android-keystore.jks file
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_STORE }}
        run: mkdir secrets && echo $ENCODED_STRING | base64 -di > apps/rpass/android/android-keystore.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: bluefireteam/melos-action@v3

      - name: Build APK
        run: |
          cd apps/rpass
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android_outputs
          path: |
            apps/rpass/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            apps/rpass/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            apps/rpass/build/app/outputs/flutter-apk/app-x86_64-release.apk
