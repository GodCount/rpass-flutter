name: Release Draft

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build_android:
    uses: ./.github/workflows/build_android.yml
    secrets: inherit

  build_macos:
    uses: ./.github/workflows/build_macos.yml

  build_windows:
    uses: ./.github/workflows/build_windows.yml
    secrets: inherit

  release:
    needs:
      - build_android
      - build_macos
      - build_windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' apps/rpass/pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Draft release
        id: draft_release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: android_outputs
          path: dist/apk

      - name: Download macOS
        uses: actions/download-artifact@v8
        with:
          name: macos_outputs
          path: dist/macos

      - name: Download Windows
        uses: actions/download-artifact@v8
        with:
          name: windows_outputs
          path: dist/windows

      - name: Rename assets
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          mkdir -p dist/upload
          cp dist/apk/app-armeabi-v7a-release.apk "dist/upload/Rpass-v${VERSION}-android-armeabi-v7a.apk"
          cp dist/apk/app-arm64-v8a-release.apk "dist/upload/Rpass-v${VERSION}-android-arm64-v8a.apk"
          cp dist/apk/app-x86_64-release.apk "dist/upload/Rpass-v${VERSION}-android-x86_64.apk"
          cp dist/macos/Rpass.dmg "dist/upload/Rpass-v${VERSION}-macos.dmg"
          cp dist/windows/Rpass.zip "dist/upload/Rpass-v${VERSION}-windows.zip"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          draft: true
          files: dist/upload/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
